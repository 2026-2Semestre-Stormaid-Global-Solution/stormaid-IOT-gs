spring.application.name=stormaid-api

# BANCO DE DADOS ORACLE
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# SWAGGER / SPRINGDOC CONFIGURAÇÕES EXPLICITAS
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# RABBITMQ - INTEGRAÇÃO JAVA E .NET
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:stormaid}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}


# SERVIDOR
server.port=${PORT:8080}
server.error.include-stacktrace=never

# POOL DE CONEXÕES HIKARI
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# CONFIGURAÇÃO DE SEGURANÇA JWT
api.security.token.secret=${JWT_SECRET}

spring.ai.openai.api-key=${API_KEY}

# CONFIGURAÇÃO DE E-MAIL (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# INFORMAÇÕES DA APLICAÇÃO E DEPLOY (TELA SOBRE)
app.info.version=${APP_VERSION:1.0.0}
app.info.repository-url=${APP_REPOSITORY_URL:https://github.com/2026-2Semestre-Stormaid-Global-Solution/stormaid-java-gs}
app.info.published-at=${APP_PUBLISHED_AT:}

# VARIÁVEIS INJETADAS PELO RENDER (QUANDO DISPONÍVEIS)
render.git.commit=${RENDER_GIT_COMMIT:}
render.git.branch=${RENDER_GIT_BRANCH:}